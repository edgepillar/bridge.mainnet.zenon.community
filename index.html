<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#06090a" />
    <meta name="description" content="Move ZNN, QSR and LP tokens between Zenon Network of Momentum and Ethereum or BNB Chain." />
    <script>
      // Before first paint, so a light choice never flashes dark (src/composables/theme.ts).
      try {
        var t = localStorage.getItem('bridge.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <title>Zenon bridge</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
